[audio]
enable_overdrive = true
enable_sounds = false

[backdrop]
enabled = true

[bar.default]
capsule = true
center = [ "workspaces" ]
end = [ "tray", "notifications", "widget", "network", "bluetooth", "volume", "brightness", "battery", "control-center" ]
margin_ends = 0
padding = 4
radius_top_left = 0
radius_top_right = 0
start = [ "clock", "group:g1", "bar", "media" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

    [battery.device."/org/freedesktop/UPower/devices/mouse_dev_CF_88_1C_9E_4D_26"]
    warning_threshold = 5

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Google"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
session_locked = "ssh-add -d"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 540.0

[keybinds]
down = [ "Down", "Ctrl+j", "Ctrl+n" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k", "Ctrl+p" ]
validate = [ "Return", "KP_Enter", "space", "Ctrl+y" ]

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
transition = [ "honeycomb", "stripes" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 32
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 150.0
    box_width = 810.0
    cx = 1280.0
    cy = 913.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.75
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.75
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 150.0
    box_width = 720.0
    cx = 960.0
    cy = 913.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.75
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.75
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 352.0
    cx = 1280.0
    cy = 268.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 32.0
    box_width = 272.0
    cx = 1280.0
    cy = 348.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        clock_style = "digital"
        font_family = ""
        format = "{:%A, %B %d}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 224.0
    box_width = 352.0
    cx = 960.0
    cy = 268.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        center_text = true
        clock_style = "digital"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 32.0
    box_width = 272.0
    cx = 960.0
    cy = 348.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        clock_style = "digital"
        font_family = ""
        format = "{:%A, %B %d}"
        shadow = false

[nightlight]
enabled = true

[notification]
history_retention_hours = 24
keep_dismissed_in_history = false
offset_y = 0
show_app_name = false

[osd]
border = false
follow_focused_output = true
position = "bottom_center"

[plugin_settings."damian-ds7/battery-threshold"]
panel_placement = "attached"

[plugin_settings."noctalia/bitwarden"]
clear_clipboard_seconds = 120
gen_length = 32
gen_passphrase_capitalize = true
gen_passphrase_include_number = true
gen_passphrase_separator = "."
gen_passphrase_words = 3
gen_special = true
hide_actions_when_searching = true

[plugin_settings."noctalia/wallpaper_depth"]
manager_open_near_click = true

[plugin_settings."tranzem/media-lyrics"]
panel-compact_open_near_click = true
panel-compact_placement = "attached"
panel_open_near_click = true
panel_size = "compact"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 1
check_reboot_needed = false
flatpak_enabled = false
notify_on_updates = false
show_activity_graph = true
show_changelog_after_update = false

[plugins]
enabled = [
    "felipeartur/ai-usagebar",
    "cleboost/ssh-launcher",
    "yuuto/arch-updater",
    "noctalia/bitwarden",
    "elijaharch/wl-screen-mirror",
    "damian-ds7/battery-threshold"
]

[shell]
polkit_agent = true
readline_shortcuts = true
screen_time_enabled = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    clipboard_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/jcdamor/pictures/screenshots"
    remember_last_region = true
    save_to_file = false
    show_cursor = true
    skip_annotate_on_copy_save = true

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "s"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "Ctrl+s"
        variant = "destructive"

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]

[wallpaper]
directory = "/home/jcdamor/pictures/wallpapers"

    [wallpaper.default]
    path = "/home/jcdamor/pictures/wallpapers/9.jpg"

    [wallpaper.last]
    path = "/home/jcdamor/pictures/wallpapers/9.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/jcdamor/pictures/wallpapers/9.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/jcdamor/pictures/wallpapers/9.jpg"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.bluetooth]
show_label = true

[widget.clock]
format = "{:%a, %b %d · %H:%M}"

[widget.cpu]
visualization = "none"

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.widget]
type = "yuuto/arch-updater:widget"
