#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[default_session]
preview_command = "eza --all --icons --color=always {}"

[[wildcard]]
pattern = "~/code/*"
startup_command = "exec nvim"
windows = ["claude", "zsh"]

[[wildcard]]
pattern = "~/dotfiles"
startup_command = "exec nvim"
windows = ["claude", "zsh"]

[[wildcard]]
pattern = "~/cowork"
startup_command = "exec nvim"
windows = ["claude", "zsh"]

[[window]]
name = "claude"
startup_script = "exec claude"

[[window]]
name = "zsh"
startup_script = "clear"
